name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assemble site (routes, custom domain, app links)
        run: |
          # Landing page at /360F/
          mkdir -p dist/360F
          cp dist/360f.html dist/360F/index.html
          # Custom domain
          cp CNAME dist/CNAME
          # Android App Links
          mkdir -p dist/.well-known
          cp .well-known/assetlinks.json dist/.well-known/assetlinks.json
          # Optional extras
          [ -f robot.txt ] && cp robot.txt dist/robot.txt || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
